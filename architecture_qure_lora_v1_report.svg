  <text x="820" y="950" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6d28d9">s+ = max_l(q · f+_l)</text>
  <rect x="960" y="895" width="200" height="70" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="1060" y="925" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#9a3412">Negative score</text>
  <text x="1060" y="950" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#c2410c">s− = max_l(q · f−_l)</text>
  <line x1="820" y1="965" x2="900" y2="1000" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1060" y1="965" x2="980" y2="1000" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="830" y="1000" width="220" height="70" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="940" y="1030" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#854d0e">KL-Div loss</text>
  <text x="940" y="1055" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#713f12">positive should win</text>

