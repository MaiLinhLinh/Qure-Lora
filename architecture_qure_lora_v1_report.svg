  <rect x="1270" y="150" width="485" height="950" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1300" y="198" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#111827">Validation / Inference</text>
