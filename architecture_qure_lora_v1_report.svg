  <rect x="1310" y="270" width="405" height="145" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="1335" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Query</text>
  <text x="1335" y="329" font-family="Arial, sans-serif" font-size="15" fill="#1e40af">reference image + caption</text>
  <text x="1335" y="357" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">reference adapter → text_proj</text>
