  <text x="1335" y="595" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#5b21b6">32 features / image</text>
  <line x1="1512" y1="625" x2="1512" y2="675" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1310" y="690" width="405" height="116" rx="16" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="1512" y="724" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#854d0e">Ranking</text>
  <text x="1512" y="754" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#713f12">max_l(q · f_l)</text>
  <text x="1512" y="782" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#713f12">Recall@10 / Recall@50</text>

  <rect x="1310" y="855" width="405" height="82" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="1512" y="889" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">Trainable: green + orange LoRA</text>
  <text x="1512" y="916" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Frozen: gray blocks and FFN base</text>
</svg>
