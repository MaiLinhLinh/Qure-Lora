  <text x="1052" y="840" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#5b21b6">negative features</text>

  <!-- separate positive/negative scores and loss -->
  <path d="M1125 625 C1170 625 1185 690 1185 875 L820 875 L820 895" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
