    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1800" height="1050" fill="#ffffff"/>
  <line x1="50" y1="36" x2="1750" y2="36" stroke="#0f172a" stroke-width="3"/>
  <text x="900" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">QuRe-LoRA Version 1</text>
  <text x="900" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#475569">Attention Q/V được thích nghi bằng LoRA; FFN gốc được đóng băng</text>

  <!-- Main training panel -->
