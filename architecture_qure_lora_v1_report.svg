  <rect x="980" y="735" width="145" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1052" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">vision_proj</text>
